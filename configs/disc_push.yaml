tag: 'none' # overwritten by ProblemInterface.__init__ with a timestamped run tag

scenario: 'disc_push'
task: 'task0' #short label for the run tag, e.g. 'task0'/'task1'/... -- set per exercise config
seed: 100 #if set, seeds SB3's RNG (TD3(..., seed=...)) and is appended to the run tag

files:
  scene_yaml: 'scenes/disc_push.yml'

Gym:
  reward_fct_name: "reward_fct_sparse" #name of a dedicated reward_fct to use instead of the generic reward_fct (see mujoco_gym.py)
  num_scenes: 20 #80
  warp_worlds: 0
  friction: "0.8 0.1 0.1"
  solref: "0.01 1." #softer than the 0.002 default: box-cylinder resting contact (disc on table) is numerically unstable at default stiffness (MuJoCo has no analytic box-cylinder solver), causing an explosive launch on contact
  min_start_sep: 0.2 #reject/resample random starts where manipulator (r=.04) and object (r=.13) overlap (sum .17 + margin)
  obj_upright: true #force the disc's orientation to identity after random sampling (setRandom() ignores quaternion limits and always tumbles it)
  view_mj: false
  tau_sim: 0.001
  tau_step: 0.05
  time_limit: 1. #(is overwritten by nominal time limit)
  goal_feat_eps: 0.04
  feat_dims: [0, 1] #object is a disc free to move in full 3D, but only x,y position is observed/rewarded
  w_success: 1.
  w_goal: 1.
  w_object: 0.5 #bootstrap nudge to find/touch the object; 0.1 undershot (too little signal to reliably contact the object), 1.0 overshot (dominated goal_delta) -- trying a middle value
  w_effort: 0.0 # Off by default, but can be used to encourage low-effort solutions (e.g. for real robot transfer)
  reward_clip_dist: null
  reward_robot_obj_clip_dist: null
  reward_robot_point: 'fing'
  reward_robot_reference: 'obj_base'
  obs_pos_scale: 1.
  obs_pos_offset: []
  obs_vel_scale: .1
  obs_referr_scale: 10.
  bounds_margin: 0.5
  eff_action: none
  goal_feat_points: ['obj', 'obj_base']
  action_scale: 1.
  observation_points: [['fing', 'obj']] #gives the policy finger-relative-to-object position


RL:
  # -- fast/laptop preset: 2D action space (transX, transY only) trains much
  # -- quicker than the 3D double_sphere task, so budgets are cut accordingly.
  RL_method: 'sbTD3'
  fixed_goal: true #simplest task: goal stays at the scene-authored default pose (table center); only start is randomized
  starts_goals_fct_name: 'getStartsGoals_random' #name of a dedicated getStartsGoals_<name> method (see problem_interface.py); getStartsGoals_curriculum for a reverse curriculum instead
  T_block: 1_000
  T_curr: 1 #no curriculum needed here: dense shaping already gives a gradient from any start, and ramping alpha/time_limit was just eating budget on "easy" episodes; alpha=1 (full random start, full time_limit) from block 1
  T_end: 15_000
  finger_start_mode: 'near' #curriculum only: 'near' = manipulator stays offset from object (easier); 'random' = tapers to a fully independent start by t=1 (harder)
  nominal_time_limit: 1.
  discount_half_life: 1.

  eval_time_limit: 5.
  eval_episodes: 200
  make_video: true #writes a short demo eval.mp4 after training; needs a working GLFW/OpenGL context -- override to false (e.g. on the CLI) if that's not available


TD3:
  device: 'cpu' #laptop workshop; set 'auto'/'cuda' for GPU
  num_threads: 8 #caps torch CPU threads regardless of host core count
  timesteps_before_training: 5_000
  train_logging_freq: 50 #cadence (in callback iterations) for the cheap training-rollout stats report/checkpoint (train/ in tensorboard) -- just summarizes rollouts already happening, no extra cost
  periodic_eval_freq: 1000 #cadence (in callback iterations) for the held-out eval (eval/ in tensorboard); null disables it. Much coarser than train_logging_freq: this runs *real* deterministic rollouts on a separate env, so it isn't free like the report above
  periodic_eval_episodes: 20 #episodes per held-out eval call, run in parallel on a dedicated eval env
  periodic_eval_time_limit: 2.0 #time limit for held-out eval episodes -- deliberately shorter than RL.eval_time_limit (which is for the one-time final eval only), since this runs ~dozens of times per training run and most early-training episodes fail (burning the full time limit) rather than succeeding early

  # Generic
  learning_rate: 1e-3
  batch_size: 2_000
  buffer_size: 200_000
  target_update_rate: 250
  exploration_noise: 0.05

  # TD3
  target_policy_noise: 0.05
  noise_clip: 0.1
  policy_freq: 2
  target_tau: 0.005

  # HER
  HER_ratio: 0.5
